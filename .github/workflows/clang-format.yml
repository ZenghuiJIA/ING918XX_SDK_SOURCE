name: C/C++ Formatting

on:
  pull_request:
    branches: [develop]
    paths:
      - ".clang-format"
      - "src/FWlib/**/*.c"
      - "src/FWlib/**/*.h"
      - "src/FWlib/**/*.cc"
      - "src/FWlib/**/*.cpp"
      - "src/FWlib/**/*.hpp"
      - "tools/check_clang_format.py"
      - ".github/workflows/clang-format.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clang-format:
    name: FWlib changed lines
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-format-18

      - name: Check new files and changed lines
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 tools/check_clang_format.py \
            --base "$BASE_SHA" \
            --clang-format clang-format-18

      - name: Explain manual runs
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "This gate needs a pull request base SHA; manual runs only validate setup."
          clang-format-18 --version
